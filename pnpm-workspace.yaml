# Dependency install/build scripts run only when listed here. true = allow,
# false = deny; unlisted packages fail install (strictDepBuilds).
allowBuilds:
  esbuild: true

# Advisories (by GHSA ID) that `pnpm audit` should not report as failures.
# Waive only unfixable, non-exploitable findings with documented rationale;
# remove entries once a patched release is available.
audit:
  ignore:
    # braces <=3.0.3 is currently unfixable because no patched release exists.
    # The dependency is transitive and is not exposed to untrusted brace
    # patterns in our application.
    - GHSA-vfj7-8cjw-p6xm

# Minimum advisory severity `pnpm audit` reports. `low` = every advisory, which
# matches the CI Dependency Audit step (bare `pnpm audit`).
auditLevel: low

# Block transitive deps from exotic sources (git/URL); only registry, workspace,
# or local. pnpm 12 default is true; set explicitly so intent survives default
# changes.
blockExoticSubdeps: true

# Shared dependency versions referenced by packages via `catalog:`.
catalog:
  "@biomejs/biome": 2.5.15
  "@fontsource/sora": 5.3.0
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@types/geojson": 7946.0.16
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.1
  jsdom: 30.1.2
  mapbox-gl: 3.32.0
  react: 19.3.0
  react-dom: 19.3.0
  react-doctor: 0.9.14
  typescript: 7.0.2
  ultracite: 7.12.2
  vite: 8.3.3
  vitest: 5.0.3

# Fail install when the current Node/pnpm version is outside package.json
# engines. Documents intent; without this, engines is advisory only.
engineStrict: true

# 21 days, expressed in minutes (21 × 24 × 60); pnpm requires minutes for this
# setting.
minimumReleaseAge: 30240

# Exclude packages from the minimum release age policy.
minimumReleaseAgeExclude:
  - fast-uri@3.1.9 # CVE-2026-110306, fixed in 3.1.9 (2026-10-19T23:05:26.357Z).
  - undici@8.12.2 # CVE-2026-109869, fixed in 8.12.2 (2026-10-15T15:05:34.415Z).
  - vite@8.3.3 # CVE-2026-112942, fixed in 8.3.3 (2026-10-06T04:10:19.326Z).
  - zod@4.6.6 # CVE-2023-54404, fixed in 4.6.6 (2026-10-11T16:18:23.878Z).

# Fail resolution instead of falling back to a version younger than
# minimumReleaseAge. Frozen-lockfile installs are also checked against this
# policy, so a locked version younger than the window fails install. For urgent
# security fixes, add an entry (with advisory ID) to minimumReleaseAgeExclude
# and remove it once the version is older than the window.
minimumReleaseAgeStrict: true

# Force-replace transitive versions across the dependency graph to avoid
# supply-chain downgrades. Add entries only when a pin is required.
# (intentionally empty)
overrides:
  "vitest@^5.0.1": 5.0.3 # CVE-2026-112950, fixed in 5.0.3 (2026-09-30T11:29:00.625Z).

# Workspace package locations; globs matching directories that contain a
# package.json.
packages:
  - "apps/*"
  - "packages/*"

# Enforces exact dependency versioning across all workspace packages.
saveExact: true

# Fail install when a dependency has build scripts not listed in allowBuilds.
# pnpm 12 default is true; set explicitly so intent survives default changes.
strictDepBuilds: true

# Fail install on unmet or conflicting peer dependencies instead of warning.
strictPeerDependencies: true

# Block installs when a version has weaker trust evidence than an
# earlier-published release (trusted publisher > provenance > none); mitigates
# supply-chain downgrades.
trustPolicy: no-downgrade

# Exclude packages from the trust policy check. Use only after verifying the
# version is safe (e.g. missing provenance is accidental, not a takeover).
trustPolicyExclude:
  - semver@6.3.1 # Required by react-doctor@0.9.1 as a transitive dependency.

# Fail `pnpm run` / `pnpm exec` when node_modules is out of sync with the
# lockfile, so a stale install never runs builds or tests.
verifyDepsBeforeRun: error